# Dzięki temu plikowi nie trzeba nic ustawiać w panelu Netlify — konfiguracja
# jedzie razem z repo.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Zasoby z hashem w nazwie nigdy się nie zmieniają pod tym samym adresem.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
