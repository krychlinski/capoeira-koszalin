# Dzięki temu plikowi nie trzeba nic ustawiać w panelu Netlify — konfiguracja
# jedzie razem z repo.

[build]
  # Astro trzyma warstwę treści w .astro ORAZ node_modules/.astro, a Netlify
  # buforuje node_modules między buildami. Bez skasowania obu usunięty wpis
  # dalej generuje swoją podstronę — sprawdzone na produkcji.
  command = "rm -rf .astro node_modules/.astro dist && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Zasoby z hashem w nazwie nigdy się nie zmieniają pod tym samym adresem.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Podstrona instruktorów została scalona z "O nas" — nie zostawiamy po niej 404.
[[redirects]]
  from = "/instruktorzy/*"
  to = "/o-nas/"
  status = 301
