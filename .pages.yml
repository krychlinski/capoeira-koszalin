# Konfiguracja panelu Pages CMS (app.pagescms.org).
# Pola muszą się zgadzać ze schematem Zod w src/content.config.ts — zmiana w jednym
# miejscu bez drugiego wywali build.

media:
  input: src/assets/media
  output: /media
  extensions: [jpg, jpeg, png, webp, avif, gif]
  rename: safe

content:
  - name: news
    label: Aktualności
    type: collection
    path: src/content/news
    format: yaml-frontmatter
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      primary: tytul
      sort: [data, tytul]
      order: desc
      fields: [tytul, data, opublikowany]
    fields:
      - { name: title, label: Tytuł, type: string, required: true }
      - { name: date, label: Data, type: date, required: true, options: { format: yyyy-MM-dd } }
      - name: excerpt
        label: Zajawka
        type: text
        description: Jedno–dwa zdania. To widać na liście wpisów i w podglądzie na Facebooku.
      - { name: image, label: Zdjęcie główne, type: image }
      - name: published
        label: Opublikowany
        type: boolean
        default: true
        description: Odznacz, żeby schować wpis bez usuwania go.
      - { name: body, label: Treść, type: rich-text }

  - name: events
    label: Wydarzenia
    type: collection
    path: src/content/events
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: tytul
      sort: [dataOd, tytul]
      order: desc
      fields: [tytul, dataOd, miejsce]
    fields:
      - { name: title, label: Tytuł, type: string, required: true }
      - { name: startDate, label: Data od, type: date, required: true, options: { format: yyyy-MM-dd } }
      - name: endDate
        label: Data do
        type: date
        options: { format: yyyy-MM-dd }
        description: Wypełnij tylko przy wydarzeniu wielodniowym.
      - { name: venue, label: Miejsce, type: string }
      - { name: excerpt, label: Zajawka, type: text }
      - { name: image, label: Zdjęcie, type: image }
      - { name: body, label: Opis, type: rich-text }

  - name: classes
    label: Grafik zajęć
    type: collection
    path: src/content/classes
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: grupa
      sort: [kolejnosc, grupa]
      order: asc
      fields: [grupa, wiek, miejsce]
    fields:
      - name: group
        label: Nazwa grupy
        type: string
        required: true
        description: Np. „Dzieci” albo „Młodzież i dorośli”.
      - { name: subtitle, label: Podtytuł, type: string, description: 'Wiek lub czas trwania, np. „od 14 lat · 90 minut”.' }
      - name: sessions
        label: Terminy
        type: object
        list: true
        fields:
          - name: day
            label: Dzień
            type: select
            options:
              values: [Poniedziałek, Wtorek, Środa, Czwartek, Piątek, Sobota, Niedziela]
          - { name: from, label: Od, type: string, description: 'Format 18:00' }
          - { name: to, label: Do, type: string }
      - { name: venue, label: Miejsce, type: string, description: Nazwa sali lub szkoły. }
      - { name: address, label: Adres, type: string }
      - name: order
        label: Kolejność
        type: number
        default: 1
        description: Mniejsza liczba = wyżej na stronie.

  - name: instructors
    label: Instruktorzy
    type: collection
    path: src/content/instructors
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: imie
      sort: [kolejnosc, imie]
      order: asc
      fields: [imie, apelido, stopien]
    fields:
      - { name: name, label: Imię i nazwisko, type: string, required: true }
      - { name: apelido, label: Apelido, type: string, description: Capoeirowe przezwisko. }
      - { name: corda, label: Stopień / corda, type: string }
      - { name: image, label: Zdjęcie, type: image }
      - { name: order, label: Kolejność, type: number, default: 1 }
      - { name: body, label: Biogram, type: rich-text }

  - name: gallery
    label: Galeria
    type: collection
    path: src/content/gallery
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: tytul
      sort: [data, tytul]
      order: desc
      fields: [tytul, data]
    fields:
      - { name: title, label: Tytuł albumu, type: string, required: true }
      - { name: date, label: Data, type: date, required: true, options: { format: yyyy-MM-dd } }
      - name: cover
        label: Okładka
        type: image
        description: Zostaw puste, żeby użyć pierwszego zdjęcia z albumu.
      - name: images
        label: Zdjęcia
        type: image
        options:
          multiple: true
          unique: true

  - name: strona-pierwszy-trening
    label: Strona „Pierwszy trening”
    type: file
    path: src/content/pages/pierwszy-trening.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Tytuł, type: string, required: true }
      - name: heading
        label: Nagłówek
        type: text
        description: Zdanie pod tytułem. Tu piszemy, że pierwszy trening jest bezpłatny.
      - { name: image, label: Zdjęcie, type: image }
      - { name: pointsEyebrow, label: Etykieta nad punktami, type: string, description: 'Np. „Co zabrać”.' }
      - { name: pointsHeading, label: Nagłówek punktów, type: string }
      - name: points
        label: Punkty
        type: object
        list: true
        description: Numery 01, 02, 03 nadają się same, według kolejności na liście.
        fields:
          - { name: title, label: Nagłówek, type: string, required: true }
          - { name: description, label: Opis, type: text, required: true }
      - { name: body, label: Dodatkowy tekst, type: rich-text, description: Nieobowiązkowy, pojawia się pod punktami. }

  - name: strona-gdzie-trenujemy
    label: Blok „Gdzie trenujemy”
    type: file
    path: src/content/pages/gdzie-trenujemy.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Tytuł, type: string, required: true }
      - { name: eyebrow, label: Nadtytuł, type: string, description: 'Mała etykieta nad nagłówkiem, np. „Gdzie trenujemy”.' }
      - { name: heading, label: Nagłówek, type: string }
      - name: body
        label: Treść
        type: rich-text
        description: Pokazuje się na stronie głównej i na Kontakcie, nad mapką. Pogrubienie: **tekst**.

  - name: strona-o-nas
    label: Strona „O nas”
    type: file
    path: src/content/pages/o-nas.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Tytuł, type: string, required: true }
      - { name: heading, label: Nagłówek, type: text, description: Zdanie pod tytułem. }
      - { name: image, label: Zdjęcie, type: image }
      - { name: body, label: Treść, type: rich-text }

  - name: strona-kontakt
    label: Strona „Kontakt”
    type: file
    path: src/content/pages/kontakt.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Tytuł, type: string, required: true }
      - { name: heading, label: Nagłówek, type: text }
      - { name: image, label: Zdjęcie, type: image }
      - { name: body, label: Treść, type: rich-text }

  - name: pricing
    label: Cennik
    type: collection
    path: src/content/pricing
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: nazwa
      sort: [kolejnosc, nazwa]
      order: asc
      fields: [nazwa, cena, kategoria]
    fields:
      - { name: name, label: Nazwa, type: string, required: true }
      - { name: price, label: Cena, type: string, required: true, description: 'Np. „200 zł” albo „od 150 zł”.' }
      - { name: description, label: Opis, type: text }
      - name: category
        label: Kategoria
        type: select
        options:
          values:
            - { name: miesieczne, label: Karnet miesięczny }
            - { name: dodatkowe, label: Opłata dodatkowa }
      - { name: order, label: Kolejność, type: number, default: 1 }

  - name: faq
    label: Częste pytania
    type: collection
    path: src/content/faq
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: pytanie
      sort: [kolejnosc, pytanie]
      order: asc
      fields: [pytanie, kolejnosc]
    fields:
      - { name: question, label: Pytanie, type: string, required: true }
      - { name: order, label: Kolejność, type: number, default: 1 }
      - { name: body, label: Odpowiedź, type: rich-text }

  - name: strona-oferta
    label: Strona „Oferta”
    type: file
    path: src/content/pages/oferta.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Tytuł, type: string, required: true }
      - { name: heading, label: Nagłówek, type: text }
      - { name: image, label: Zdjęcie, type: image }
      - { name: body, label: Treść, type: rich-text }

  - name: strona-regulamin
    label: Strona „Regulamin”
    type: file
    path: src/content/pages/regulamin.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Tytuł, type: string, required: true }
      - { name: heading, label: Nagłówek, type: text }
      - { name: image, label: Zdjęcie, type: image }
      - { name: body, label: Treść, type: rich-text }

  - name: settings
    label: Ustawienia
    type: file
    path: src/data/settings.json
    format: json
    fields:
      - { name: name, label: Nazwa akademii, type: string, required: true }
      - { name: group, label: Nazwa grupy, type: string }
      - name: seoDescription
        label: Opis dla Google
        type: text
        description: Do 160 znaków — to widać w wynikach wyszukiwania.
      - { name: heroTagline, label: Hasło na stronie głównej, type: text }
      - { name: heroImage, label: Zdjęcie tła (strona główna), type: image }
      - name: heroYoutubeVideo
        label: Wideo YouTube (strona główna)
        type: string
        description: Samo ID filmu, np. dQw4w9WgXcQ. Ma pierwszeństwo przed zdjęciem.
      - name: notice
        label: Komunikat na stronie
        type: object
        fields:
          - name: body
            label: Treść
            type: text
            description: 'Krótka informacja nad grafikiem — odwołane zajęcia, zmiana sali, ferie. Pogrubienie: **tekst**. Puste = brak komunikatu.'
          - name: until
            label: Wyświetlaj do
            type: date
            options: { format: yyyy-MM-dd }
            description: Po tym dniu komunikat zniknie sam. Puste = wisi, dopóki go nie skasujesz.
      - { name: phone, label: Telefon, type: string }
      - { name: email, label: E-mail, type: string }
      - { name: address, label: Adres, type: text }
      - name: mapUrl
        label: Odnośnik do map
        type: string
        description: Adres z Map Google — otwiera się po kliknięciu w mapkę. Sama mapka jest obrazkiem w repozytorium, po zmianie adresu trzeba ją wyrenderować od nowa.
      - { name: facebook, label: Facebook, type: string, description: Pełny adres URL. }
      - { name: instagram, label: Instagram, type: string }
      - { name: youtube, label: YouTube, type: string }
