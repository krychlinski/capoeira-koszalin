name: Zbuduj i wdróż

# Jedno miejsce, w którym powstaje strona. Uruchamia się przy zmianie w gałęzi
# main, co trzy godziny po nowe posty z Facebooka oraz ręcznie przyciskiem.
#
# Dlaczego tutaj, a nie w Cloudflare: projekt Pages został założony z linii
# poleceń, a takiego nie da się już połączyć z repozytorium — Cloudflare buduje
# tylko projekty połączone z gitem od samego początku. Budowanie u GitHuba
# załatwia przy okazji harmonogram, więc nie potrzebujemy deploy hooka.
#
# Godziny w UTC, GitHub nie obsługuje stref czasowych, więc ZIMĄ wszystko
# przesuwa się o godzinę wcześniej czasu polskiego (5:07-21:07 zamiast 6:07-22:07).
# Nie warto tego gonić dwoma zestawami crona przełączanymi dwa razy w roku.
# GitHub wyłącza harmonogram w repozytoriach bez zmian przez 60 dni — wtedy
# wystarczy jedno uruchomienie ręczne przyciskiem "Run workflow".
#
# Budujemy przy każdym uruchomieniu, ale WDRAŻAMY tylko przy zmianie treści.
# Budowanie jest darmowe, wdrożenie zużywa limit — bez tego rozdzielenia częstsze
# zaglądanie do Facebooka kosztowałoby wprost. Patrz krok "Sprawdź, czy coś się
# zmieniło".

on:
  push:
    branches: [main]
  schedule:
    # Co godzinę w dzień, rzadziej w nocy — klub nie publikuje o trzeciej.
    # Minuta 7, a nie 0, żeby ominąć zapchany szczyt godziny: zaplanowane
    # workflow stoją u GitHuba w kolejce i o pełnej godzinie czekają najdłużej.
    - cron: '7 4-20 * * *'
    - cron: '7 23,2 * * *'
  workflow_dispatch:

# Dwa wdrożenia naraz mogłyby postawić na produkcji starszą wersję.
concurrency:
  group: wdrozenie
  cancel-in-progress: false

jobs:
  wdroz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Zbuduj stronę
        run: npm run build:czysty
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}

      # Porównujemy odcisk świeżo zbudowany z tym, który leży na produkcji.
      # Odcisk obejmuje wyłącznie to, co renderujemy, więc nowy komentarz pod
      # postem go nie ruszy — komentarzy nawet nie pobieramy z Facebooka.
      #
      # Sprawdzamy tylko przy uruchomieniu z harmonogramu. Wypchnięcie zmiany
      # i przycisk "Run workflow" wdrażają zawsze: tam zmiana może siedzieć
      # w szacie albo w treści z panelu, czyli poza odciskiem aktualności.
      - name: Sprawdź, czy coś się zmieniło
        id: zmiana
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "powod=uruchomienie ${{ github.event_name }} — wdrażamy zawsze" >> "$GITHUB_OUTPUT"
            echo "wdrazac=tak" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          nowy=$(jq -r '.fingerprint' dist/aktualnosci/latest.json)
          stary=$(curl -sS --max-time 20 \
            https://www.capoeira.koszalin.pl/aktualnosci/latest.json \
            | jq -r '.fingerprint // empty' 2>/dev/null || true)

          if [ -z "$stary" ]; then
            # Produkcja nieosiągalna albo jeszcze bez odcisku. Wdrażamy —
            # przy wątpliwości lepiej wdrożyć niepotrzebnie niż przegapić wpis.
            echo "powod=nie udało się odczytać odcisku z produkcji" >> "$GITHUB_OUTPUT"
            echo "wdrazac=tak" >> "$GITHUB_OUTPUT"
          elif [ "$nowy" = "$stary" ]; then
            echo "powod=bez zmian ($nowy)" >> "$GITHUB_OUTPUT"
            echo "wdrazac=nie" >> "$GITHUB_OUTPUT"
          else
            echo "powod=treść się zmieniła ($stary -> $nowy)" >> "$GITHUB_OUTPUT"
            echo "wdrazac=tak" >> "$GITHUB_OUTPUT"
          fi

      - name: Podsumuj decyzję
        run: echo "${{ steps.zmiana.outputs.wdrazac }} — ${{ steps.zmiana.outputs.powod }}"

      - name: Wdróż na Cloudflare Pages
        if: steps.zmiana.outputs.wdrazac == 'tak'
        run: npx wrangler pages deploy dist --project-name=capoeira-koszalin --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 58f78072cb67c0aa3663aeb0818b111b

      # MUSI iść po wdrożeniu. Powiadomienia wychodzą puste, a service worker
      # dociąga treść z /aktualnosci/latest.json — gdyby rozgłoszenie poszło przed
      # wdrożeniem, ludzie dostaliby powiadomienie o poprzednim wpisie.
      #
      # Wołamy przy każdym budowaniu, także wtedy, gdy nic się nie zmieniło:
      # Worker pamięta ostatni rozesłany wpis i sam pomija powtórki.
      - name: Rozgłoś nowy wpis
        if: steps.zmiana.outputs.wdrazac == 'tak'
        run: |
          id=$(jq -r '.latest.id // empty' dist/aktualnosci/latest.json)
          if [ -z "$id" ]; then
            echo "Brak wpisów — nie ma czego rozgłaszać."
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            https://capoeira-push.kacper-rychlinski.workers.dev/notify \
            -H 'Content-Type: application/json' \
            -H "X-Notify-Secret: $NOTIFY_SECRET" \
            -d "$(jq -c '{id: .latest.id, date: .latest.date}' dist/aktualnosci/latest.json)"
          echo
        env:
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
