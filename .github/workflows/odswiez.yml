name: Odśwież stronę

# Buduje stronę co trzy godziny, żeby zaciągnąć nowe posty z Facebooka.
# Bez tego aktualności odświeżają się tylko przy zapisie w CMS-ie albo commicie.
#
# Osiem razy na dobę to 243 buildy miesięcznie. Limit Cloudflare wynosi 500 MIESIĘCZNIE,
# nie tygodniowo, więc zostaje 257 na nasze własne zmiany. Co dwie godziny byłoby 365
# i zapas spadłby do 135 — za ciasno przy dniu z kilkunastoma poprawkami.
#
# Godziny są w UTC, GitHub nie obsługuje stref czasowych. Przy odświeżaniu aktualności
# to bez znaczenia — liczy się odstęp, nie pora.
#
# GitHub zastrzega, że zaplanowane zadania bywają opóźnione przy dużym obciążeniu.
# Wyłącza je też w repozytoriach bez aktywności przez 60 dni — wtedy wystarczy
# uruchomić ręcznie przyciskiem "Run workflow".

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  odswiez:
    runs-on: ubuntu-latest
    steps:
      - name: Wywołaj deploy hook
        run: |
          if [ -z "${{ secrets.CF_DEPLOY_HOOK }}" ]; then
            echo "Brak sekretu CF_DEPLOY_HOOK — nic nie robię."
            echo "Ustaw go w Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          curl -fsS -X POST -o /dev/null -w 'HTTP %{http_code}\n' "${{ secrets.CF_DEPLOY_HOOK }}"
